<div class="modal-header">
  <h4 class="modal-title" [translate]="type + '.test-connection.title'"></h4>
</div>
<div class="modal-body">
  @if (!loading) {
    @if (error) {
      <div class="alert alert-danger" id="connection-error">
        <div [translate]="type + '.test-connection.error'"></div>
        <hr />
        <div style="overflow-wrap: break-word">{{ error }}</div>
      </div>
    } @else {
      @if (success) {
        <div class="alert alert-info" id="success" [translate]="type + '.test-connection.success'"></div>

        @if (showAvailablePoints) {
          <div class="mt-3">
            <h5>Available Points:</h5>
            <div class="table-responsive" style="max-height: 400px; overflow-y: auto">
              <table class="table table-sm table-hover">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  @for (point of availablePoints; track point.id) {
                    <tr>
                      <td>{{ point.name }}</td>
                      <td>{{ point.description || point.path || '-' }}</td>
                      <td>
                        <button class="btn btn-sm btn-primary" (click)="selectPoint(point)" type="button">Select</button>
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
          </div>
        }
      }
    }
  } @else {
    <div class="text-center">
      <div class="spinner-border" id="spinner" role="status"></div>
    </div>
  }
</div>
<div class="modal-footer">
  <div class="btn-group">
    <button type="button" class="btn btn-cancel" (click)="cancel()" translate="common.close" id="cancel-button"></button>
  </div>
</div>
